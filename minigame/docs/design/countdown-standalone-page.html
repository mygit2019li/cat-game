<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>独立倒计时页面</title>
  <style>
    :root {
      --bg-1: #f6fbf8;
      --bg-2: #eaf6f1;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #d7ebe3;
      --ink: #103b43;
      --ink-2: #51717a;
      --teal: #0f9d8e;
      --teal-deep: #0d6b7d;
      --amber: #ffb02e;
      --danger: #e75f55;
      --shadow: 0 26px 80px rgba(16, 59, 67, 0.16);
      --radius: clamp(24px, 4vw, 42px);
      --control-min: 48px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 12%, rgba(15, 157, 142, 0.14), transparent 28%),
        radial-gradient(circle at 86% 82%, rgba(255, 176, 46, 0.18), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .countdown-page {
      position: relative;
      width: min(1180px, calc(100vw - 28px));
      height: min(820px, calc(100dvh - 28px));
      min-height: 520px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 88% 18%, rgba(15, 157, 142, 0.09), transparent 22%),
        radial-gradient(circle at 16% 82%, rgba(255, 176, 46, 0.12), transparent 24%),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .page-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 0;
      padding: clamp(16px, 3vw, 28px) clamp(20px, 4vw, 42px) 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #12b3a1, #0d6b7d);
      color: #fff;
      font-size: 22px;
      box-shadow: 0 12px 28px rgba(13, 107, 125, 0.22);
      flex: 0 0 auto;
    }

    .brand-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .eyebrow {
      margin: 0;
      color: var(--teal-deep);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-chip {
      flex: 0 0 auto;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.76);
      color: var(--ink-2);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b9c8c4;
      box-shadow: 0 0 0 0 rgba(15, 157, 142, 0);
    }

    .status-chip.is-ready .status-dot {
      background: #61c8b6;
    }

    .status-chip.is-running .status-dot {
      background: var(--teal);
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    .status-chip.is-ended .status-dot {
      background: var(--amber);
    }

    .page-center {
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 42px);
    }

    .timer-card {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      align-items: stretch;
      gap: clamp(18px, 3vw, 36px);
    }

    .display-panel {
      position: relative;
      min-height: clamp(300px, 48vh, 520px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: calc(var(--radius) - 8px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.42)),
        repeating-linear-gradient(135deg, rgba(15, 157, 142, 0.045) 0 2px, transparent 2px 22px);
      border: 1px solid rgba(215, 235, 227, 0.95);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .display-panel::before,
    .display-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(15, 157, 142, 0.1);
      pointer-events: none;
    }

    .display-panel::before {
      width: min(540px, 84%);
      aspect-ratio: 1;
      opacity: 0.95;
    }

    .display-panel::after {
      width: min(720px, 108%);
      aspect-ratio: 1;
      opacity: 0.45;
    }

    .time-block {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      gap: clamp(10px, 2vh, 18px);
      padding: 24px;
      width: 100%;
      text-align: center;
    }

    .time-label {
      margin: 0;
      color: var(--ink-2);
      font-size: clamp(15px, 1.7vw, 18px);
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .time-number {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.7vw, 8px);
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: -0.08em;
      color: var(--ink);
      user-select: none;
    }

    .time-number .digit {
      min-width: 0.66em;
      font-size: clamp(88px, 17vw, 190px);
      text-shadow: 0 18px 42px rgba(16, 59, 67, 0.12);
      transition: transform 0.18s ease, color 0.2s ease;
    }

    .time-number .separator {
      font-size: clamp(52px, 9vw, 118px);
      transform: translateY(-0.08em);
      color: rgba(16, 59, 67, 0.24);
    }

    .time-number.is-active .digit {
      color: var(--teal-deep);
    }

    .time-number.is-ended .digit {
      color: var(--amber);
      text-shadow: 0 20px 48px rgba(255, 176, 46, 0.28);
    }

    .progress-shell {
      width: min(520px, 94%);
      display: grid;
      gap: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-track {
      height: 14px;
      border-radius: 999px;
      background: #e5f2ee;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(16, 59, 67, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), #59c7b2 68%, var(--amber));
      transition: width 0.18s linear;
    }

    .side-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: clamp(14px, 2.2vh, 20px);
      padding: clamp(18px, 2.5vw, 28px);
      border-radius: calc(var(--radius) - 8px);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(215, 235, 227, 0.95);
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .preset-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      border-radius: 16px;
      min-height: var(--control-min);
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .preset-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 157, 142, 0.38);
      color: var(--teal-deep);
    }

    .preset-btn.is-active {
      background: linear-gradient(135deg, #12b3a1, #0d6b7d);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 14px 28px rgba(13, 107, 125, 0.18);
    }

    .custom-time {
      display: grid;
      gap: 10px;
    }

    .custom-label {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-2);
    }

    .custom-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .time-field {
      display: grid;
      gap: 6px;
    }

    .time-field span {
      font-size: 12px;
      font-weight: 800;
      color: #6a838a;
    }

    .time-field input {
      width: 100%;
      min-height: var(--control-min);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .time-field input:focus-visible {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15, 157, 142, 0.14);
    }

    .action-zone {
      display: grid;
      gap: 12px;
      align-content: end;
    }

    .primary-btn,
    .ghost-btn {
      appearance: none;
      border: 0;
      width: 100%;
      min-height: var(--control-min);
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #12b3a1, #0d6b7d);
      color: #fff;
      box-shadow: 0 18px 34px rgba(13, 107, 125, 0.22);
    }

    .ghost-btn {
      background: #fff;
      color: var(--ink-2);
      border: 1px solid var(--line);
    }

    .primary-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
    }

    .primary-btn:active,
    .ghost-btn:active,
    .preset-btn:active {
      transform: translateY(0) scale(0.99);
    }

    .primary-btn:disabled,
    .ghost-btn:disabled,
    .preset-btn:disabled,
    .time-field input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .primary-btn:focus-visible,
    .ghost-btn:focus-visible,
    .preset-btn:focus-visible {
      outline: 3px solid rgba(15, 157, 142, 0.24);
      outline-offset: 2px;
    }

    .page-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 0 clamp(20px, 4vw, 42px) clamp(16px, 3vw, 28px);
    }

    .hint {
      margin: 0;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.92;
    }

    .end-banner {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 140%);
      width: min(560px, calc(100% - 36px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 176, 46, 0.32);
      background: linear-gradient(135deg, rgba(255, 246, 229, 0.98), rgba(255, 255, 255, 0.96));
      box-shadow: 0 18px 42px rgba(255, 176, 46, 0.18);
      color: #7a4d00;
      font-size: 15px;
      font-weight: 800;
      transition: transform 0.35s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    .end-banner.is-visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .end-banner .end-copy {
      display: grid;
      gap: 4px;
    }

    .end-banner strong {
      font-size: 17px;
      line-height: 1.2;
    }

    .end-banner small {
      font-size: 13px;
      font-weight: 700;
      color: #9a6a1d;
    }

    .end-action {
      flex: 0 0 auto;
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      background: #103b43;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .end-action:hover {
      transform: translateY(-1px);
    }

    @keyframes pulseDot {
      0% {
        box-shadow: 0 0 0 0 rgba(15, 157, 142, 0.28);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(15, 157, 142, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(15, 157, 142, 0);
      }
    }

    @keyframes popDigit {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
      }
    }

    .time-number.tick .digit {
      animation: popDigit 0.32s ease;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .stage {
        padding: 0;
      }

      .countdown-page {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        grid-template-rows: auto 1fr auto;
      }

      .page-topbar {
        margin: 0;
      }

      .timer-card {
        grid-template-columns: 1fr;
        width: 100%;
        height: 100%;
        align-items: stretch;
      }

      .display-panel {
        min-height: 48vh;
      }

      .side-panel {
        grid-template-rows: auto auto 1fr;
        padding-bottom: 0;
      }

      .action-zone {
        padding-bottom: 8px;
      }
    }

    @media (max-width: 560px) {
      .brand-mark {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .status-chip {
        max-width: 44vw;
        padding: 0 12px;
        font-size: 13px;
      }

      .time-number .digit {
        font-size: clamp(72px, 22vw, 120px);
      }

      .time-number .separator {
        font-size: clamp(42px, 12vw, 72px);
      }

      .time-options {
        grid-template-columns: repeat(3, 1fr);
      }

      .custom-row {
        grid-template-columns: repeat(3, 1fr);
      }

      .page-bottom {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .hint {
        text-align: center;
      }

      .end-banner {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        bottom: 14px;
        padding: 12px 14px;
      }

      .end-action {
        width: 100%;
      }
    }

    @media (max-height: 620px) {
      .countdown-page {
        grid-template-rows: auto 1fr auto;
      }

      .page-topbar,
      .page-bottom {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .display-panel {
        min-height: 0;
      }

      .time-number .digit {
        font-size: clamp(68px, 12vh, 120px);
      }

      .side-panel {
        grid-template-rows: 1fr;
        grid-template-columns: repeat(3, 1fr);
        align-items: center;
        padding: 14px;
      }

      .time-options {
        grid-template-columns: repeat(3, 1fr);
        justify-items: stretch;
      }

      .custom-time {
        display: none;
      }

      .action-zone {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        align-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .time-number .digit,
      .progress-fill,
      .end-banner,
      .primary-btn,
      .ghost-btn,
      .preset-btn,
      .end-action {
        transition: none;
      }

      .time-number.tick .digit {
        animation: none;
      }

      .status-chip.is-running .status-dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" role="main" aria-label="独立倒计时页面">
    <section class="countdown-page" aria-labelledby="pageTitle">
      <header class="page-topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">⏱</div>
          <div class="brand-copy">
            <p class="eyebrow">Standalone Countdown</p>
            <h1 class="brand-title" id="pageTitle">全屏倒计时</h1>
          </div>
        </div>
        <div class="status-chip is-ready" id="statusChip" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">已就绪</span>
        </div>
      </header>

      <div class="page-center">
        <div class="timer-card">
          <section class="display-panel" aria-label="倒计时显示区域">
            <div class="time-block">
              <p class="time-label" id="timeLabel">剩余时间</p>
              <div class="time-number" id="timeNumber" aria-hidden="true">
                <span class="digit">0</span>
                <span class="separator">:</span>
                <span class="digit">0</span>
              </div>
              <div class="progress-shell">
                <div class="progress-meta">
                  <span id="progressLabel">0%</span>
                  <span id="totalLabel">0:00</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
              </div>
              <p class="visually-hidden" id="srTime" aria-live="polite">剩余时间 0 秒</p>
            </div>
          </section>

          <aside class="side-panel" aria-label="倒计时设置">
            <div class="time-options" role="group" aria-label="预设时间">
              <button type="button" class="preset-btn" data-seconds="30">30秒</button>
              <button type="button" class="preset-btn is-active" data-seconds="60">1分钟</button>
              <button type="button" class="preset-btn" data-seconds="180">3分钟</button>
            </div>

            <div class="custom-time">
              <p class="custom-label">自定义时长</p>
              <div class="custom-row">
                <label class="time-field">
                  <span for="inputMinutes">分</span>
                  <input id="inputMinutes" type="number" min="0" max="99" step="1" value="0" inputmode="numeric" />
                </label>
                <label class="time-field">
                  <span for="inputSeconds">秒</span>
                  <input id="inputSeconds" type="number" min="0" max="59" step="1" value="60" inputmode="numeric" />
                </label>
                <button type="button" class="ghost-btn" id="applyCustomBtn" style="min-height:48px;border-radius:14px;">应用</button>
              </div>
            </div>

            <div class="action-zone">
              <button type="button" class="primary-btn" id="startBtn">开始倒计时</button>
              <button type="button" class="ghost-btn" id="resetBtn">重置</button>
            </div>
          </aside>
        </div>
      </div>

      <footer class="page-bottom">
        <p class="hint" id="pageHint">选择时长后点击开始；倒计时结束会在页面内显示提示，不需要弹窗。</p>
      </footer>

      <div class="end-banner" id="endBanner" role="alert" aria-live="assertive">
        <div class="end-copy">
          <strong>倒计时结束</strong>
          <small>本段计时已完成，可以重新开始。</small>
        </div>
        <button type="button" class="end-action" id="restartBtn">再来一次</button>
      </div>
    </section>
  </main>

  <script>
    const presetButtons = Array.from(document.querySelectorAll(".preset-btn"));
    const inputMinutes = document.getElementById("inputMinutes");
    const inputSeconds = document.getElementById("inputSeconds");
    const applyCustomBtn = document.getElementById("applyCustomBtn");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const restartBtn = document.getElementById("restartBtn");
    const timeNumber = document.getElementById("timeNumber");
    const timeLabel = document.getElementById("timeLabel");
    const srTime = document.getElementById("srTime");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const totalLabel = document.getElementById("totalLabel");
    const statusChip = document.getElementById("statusChip");
    const statusText = document.getElementById("statusText");
    const endBanner = document.getElementById("endBanner");
    const pageHint = document.getElementById("pageHint");

    const MIN_TOTAL = 1;
    const MAX_TOTAL = 60 * 60;

    let totalSeconds = 60;
    let remainingMs = totalSeconds * 1000;
    let running = false;
    let ended = false;
    let rafId = 0;
    let lastTick = 0;
    let lastWholeSecond = null;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const pad = (value) => String(value).padStart(2, "0");

    function formatClock(totalSec) {
      const safe = Math.max(0, Math.round(totalSec));
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return minutes + ":" + pad(seconds);
    }

    function getSecondsInput() {
      const minutes = parseInt(inputMinutes.value, 10) || 0;
      const seconds = parseInt(inputSeconds.value, 10) || 0;
      return clamp(minutes * 60 + seconds, 0, MAX_TOTAL);
    }

    function setTotalSeconds(seconds, { syncInputs = true } = {}) {
      totalSeconds = clamp(seconds, MIN_TOTAL, MAX_TOTAL);
      remainingMs = totalSeconds * 1000;
      ended = false;
      hideEndBanner();
      if (syncInputs) {
        inputMinutes.value = String(Math.floor(totalSeconds / 60));
        inputSeconds.value = String(totalSeconds % 60);
      }
      totalLabel.textContent = formatClock(totalSeconds);
      render();
    }

    function setStatus(mode, text) {
      statusChip.classList.remove("is-ready", "is-running", "is-ended");
      if (mode === "ready") statusChip.classList.add("is-ready");
      if (mode === "running") statusChip.classList.add("is-running");
      if (mode === "ended") statusChip.classList.add("is-ended");
      statusText.textContent = text;
    }

    function setButtonsLocked(locked) {
      presetButtons.forEach((btn) => {
        btn.disabled = locked;
      });
      inputMinutes.disabled = locked;
      inputSeconds.disabled = locked;
      applyCustomBtn.disabled = locked;
    }

    function start() {
      if (running) return;
      if (remainingMs <= 0) {
        remainingMs = totalSeconds * 1000;
      }
      running = true;
      ended = false;
      hideEndBanner();
      lastTick = performance.now();
      lastWholeSecond = null;
      startBtn.textContent = "暂停";
      pageHint.textContent = "倒计时进行中；点击按钮可暂停，结束后页面内会显示提示。";
      setStatus("running", "进行中");
      setButtonsLocked(true);
      startBtn.disabled = false;
      resetBtn.disabled = false;
      rafId = requestAnimationFrame(loop);
    }

    function pause() {
      if (!running) return;
      running = false;
      cancelAnimationFrame(rafId);
      startBtn.textContent = "继续";
      setStatus("ready", "已暂停");
      setButtonsLocked(false);
      pageHint.textContent = "已暂停；可继续倒计时，或重置到完整时长。";
    }

    function reset() {
      running = false;
      cancelAnimationFrame(rafId);
      ended = false;
      remainingMs = totalSeconds * 1000;
      lastWholeSecond = null;
      hideEndBanner();
      startBtn.textContent = "开始倒计时";
      setButtonsLocked(false);
      setStatus("ready", "已就绪");
      pageHint.textContent = "已重置；选择新时长后点击开始。";
      render();
    }

    function showEndBanner() {
      endBanner.classList.add("is-visible");
    }

    function hideEndBanner() {
      endBanner.classList.remove("is-visible");
    }

    function finish() {
      running = false;
      ended = true;
      cancelAnimationFrame(rafId);
      remainingMs = 0;
      startBtn.textContent = "开始倒计时";
      setButtonsLocked(false);
      setStatus("ended", "已完成");
      timeLabel.textContent = "时间到";
      pageHint.textContent = "倒计时已结束，可点击“再来一次”重新开始。";
      showEndBanner();
      render();
    }

    function loop(now) {
      if (!running) return;
      const delta = now - lastTick;
      lastTick = now;
      remainingMs = Math.max(0, remainingMs - delta);
      render();
      if (remainingMs <= 0) {
        finish();
        return;
      }
      rafId = requestAnimationFrame(loop);
    }

    function render() {
      const remainingSec = Math.ceil(remainingMs / 1000);
      const displaySec = Math.max(0, remainingSec);
      const minutes = Math.floor(displaySec / 60);
      const seconds = displaySec % 60;
      const digits = Array.from(pad(minutes) + pad(seconds));

      if (lastWholeSecond !== remainingSec) {
        if (lastWholeSecond !== null) {
          timeNumber.classList.remove("tick");
          void timeNumber.offsetWidth;
          timeNumber.classList.add("tick");
        }
        lastWholeSecond = remainingSec;
      }

      timeNumber.innerHTML =
        digits.map((d) => `<span class="digit">${d}</span>`).join(`<span class="separator">:</span>`);

      timeNumber.classList.toggle("is-active", running);
      timeNumber.classList.toggle("is-ended", ended);

      const progress = totalSeconds > 0 ? clamp(remainingMs / (totalSeconds * 1000), 0, 1) : 0;
      progressFill.style.width = (progress * 100).toFixed(2) + "%";
      progressLabel.textContent = Math.round(progress * 100) + "%";
      srTime.textContent = ended ? "倒计时结束" : `剩余时间 ${remainingSec} 秒`;

      if (!running && !ended) {
        timeLabel.textContent = "剩余时间";
      }
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (running) return;
        const seconds = parseInt(btn.dataset.seconds, 10) || 0;
        presetButtons.forEach((item) => item.classList.toggle("is-active", item === btn));
        setTotalSeconds(seconds);
      });
    });

    applyCustomBtn.addEventListener("click", () => {
      if (running) return;
      const seconds = getSecondsInput();
      if (seconds < MIN_TOTAL) {
        pageHint.textContent = "时长至少需要 1 秒。";
        return;
      }
      presetButtons.forEach((btn) => {
        btn.classList.toggle("is-active", parseInt(btn.dataset.seconds, 10) === seconds);
      });
      setTotalSeconds(seconds);
    });

    [inputMinutes, inputSeconds].forEach((input) => {
      input.addEventListener("change", () => {
        if (running) return;
        const seconds = getSecondsInput();
        if (seconds >= MIN_TOTAL) {
          presetButtons.forEach((btn) => {
            btn.classList.toggle("is-active", parseInt(btn.dataset.seconds, 10) === seconds);
          });
          setTotalSeconds(seconds, { syncInputs: false });
        }
      });
    });

    startBtn.addEventListener("click", () => {
      if (running) {
        pause();
      } else {
        start();
      }
    });

    resetBtn.addEventListener("click", reset);
    restartBtn.addEventListener("click", () => {
      reset();
      start();
    });

    window.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement) return;
      if (event.code === "Space") {
        event.preventDefault();
        if (running) pause();
        else start();
      }
      if (event.key === "r" || event.key === "R") {
        reset();
      }
    });

    setTotalSeconds(60);
  </script>
</body>
</html>
