<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>minigame harness</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #gameCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/* wx 浏览器垫片：把小游戏 wx API 映射到 Web 同构能力（仅供本地测试） */
(function () {
  const canvasEl = document.getElementById("gameCanvas");
  let firstCanvas = true;
  const startCbs = [], endCbs = [], showCbs = [], hideCbs = [];
  /* 测试可注入系统信息（模拟机型怪癖）：window.__sysInfo 覆盖默认值 */
  window.__sysInfo = null;
  window.__wxShow = (res) => showCbs.forEach(f => { try { f(res); } catch (e) {} });
  window.wx = {
    getSystemInfoSync: () => window.__sysInfo || {
      windowWidth: innerWidth, windowHeight: innerHeight, pixelRatio: 2,
      safeArea: { left: 0, top: 0, right: innerWidth, bottom: innerHeight }
    },
    /* 右上角胶囊按钮 mock：模拟真机横屏位置（右上角，宽 87 高 32，右距 7 顶距 4） */
    getMenuButtonBoundingClientRect: () => ({
      left: innerWidth - 94, top: 4, right: innerWidth - 7, bottom: 36,
      width: 87, height: 32
    }),
    createCanvas: () => { if (firstCanvas) { firstCanvas = false; return canvasEl; } return document.createElement("canvas"); },
    setKeepScreenOn: () => {},
    vibrateShort: () => {},
    getAccountInfoSync: () => ({ miniProgram: { envVersion: "develop" } }),
    setEnableDebug: () => {},
    getStorageSync: (k) => localStorage.getItem(k) || "",
    setStorageSync: (k, v) => localStorage.setItem(k, v),
    /* 关系链：主域上报成绩 + 开放数据域消息通道（记录到 window 供测试断言） */
    setUserCloudStorage: () => {},
    getOpenDataContext: () => ({
      postMessage: (msg) => { (window.__odcMsgs = window.__odcMsgs || []).push(msg); }
    }),
    createWebAudioContext: () => new (window.AudioContext || window.webkitAudioContext)(),
    /* ===== 自定义召唤卡用到的 API 垫片 =====
       测试里不弹系统面板：渠道返回值由 window.__pickStub 注入，给字符串就是所有渠道同一个
       值（老测试不用改），也可以给分渠道对象 image:{album,chat,camera} /
       audio:{record,chat,file}；文本由 window.__kbDone({value}) 收尾；录音由 window.__recStub
       给 {path, err}，stop() 时按它回调，window.__recActive 用来断言麦克风有没有被释放；
       USER_DATA_PATH 默认留空，让 dataURL 直接当路径用（截图里能看到自定义图），
       要测落盘分支的测试自己把它改成非空即可走 copyFileSync。 */
    env: { USER_DATA_PATH: "" },
    getFileSystemManager: () => ({
      copyFileSync(from, to) { (window.__fsStore = window.__fsStore || {})[to] = from; },
      unlinkSync(p) { if (window.__fsStore) delete window.__fsStore[p]; }
    }),
    chooseMedia: (o) => {
      const s = window.__pickStub || {};
      const src = (o.sourceType || ["album"])[0];
      const p = typeof s.image === "string" ? s.image : ((s.image || {})[src] || "");
      window.__lastPick = { api: "chooseMedia", source: src, path: p };
      o[p ? "success" : "fail"]({ tempFiles: [{ tempFilePath: p }] });
    },
    chooseMessageFile: (o) => {
      const s = window.__pickStub || {};
      /* type 就是渠道：image=聊天里的图，file=聊天里的文件，all=系统文件框 */
      const p = o.type === "image"
        ? (typeof s.image === "string" ? s.image : ((s.image || {}).chat || ""))
        : (typeof s.audio === "string" ? s.audio : ((s.audio || {})[o.type === "all" ? "file" : "chat"] || ""));
      window.__lastPick = { api: "chooseMessageFile", type: o.type, ext: (o.extension || []).join(","), path: p };
      o[p ? "success" : "fail"]({ tempFiles: [{ path: p, name: String(p).split("/").pop() }] });
    },
    getRecorderManager: () => {
      const h = {};
      const set = (k) => (cb) => { h[k] = cb; };
      window.__recH = h;
      return {
        onStart: set("onStart"), onStop: set("onStop"), onError: set("onError"),
        start(o) { window.__recOpts = o; window.__recActive = true; if (h.onStart) h.onStart(); },
        stop() {
          window.__recActive = false;
          const s = window.__recStub || {};
          if (s.err) { if (h.onError) h.onError({ errMsg: s.err }); return; }
          if (h.onStop) h.onStop({ tempFilePath: s.path || "wxfile://tmp/rec.mp3" });
        },
        pause() {}, resume() {}
      };
    },
    showKeyboard: (o) => { window.__kbValue = (o && o.defaultValue) || ""; },
    hideKeyboard: () => {},
    onKeyboardInput: () => {}, offKeyboardInput: () => {},
    onKeyboardComplete: (cb) => { window.__kbDone = cb; },
    offKeyboardComplete: () => { window.__kbDone = null; },
    onWindowResize: (cb) => window.addEventListener("resize", cb),
    onShow: (cb) => showCbs.push(cb),
    onHide: (cb) => hideCbs.push(cb),
    onTouchStart: (cb) => startCbs.push(cb),
    onTouchEnd: (cb) => endCbs.push(cb)
  };
  const toTouch = (e) => {
    const r = canvasEl.getBoundingClientRect();
    const t = [{ clientX: e.clientX - r.left, clientY: e.clientY - r.top, identifier: 0 }];
    return { touches: t, changedTouches: t };
  };
  document.addEventListener("pointerdown", (e) => startCbs.forEach(f => f(toTouch(e))));
  document.addEventListener("pointerup", (e) => endCbs.forEach(f => f(toTouch(e))));

  /* 迷你 CommonJS：模块源码由测试脚本注入 window.__MODULES__ */
  const REG = (window.__MODULES__ = {});
  const CACHE = {};
  window.__req__ = (name) => {
    if (CACHE[name]) return CACHE[name].exports;
    const src = REG[name];
    if (src == null) throw new Error("module not found: " + name);
    const m = { exports: {} };
    CACHE[name] = m;
    new Function("module", "exports", "require", src)(m, m.exports, window.__req__);
    return m.exports;
  };
  window.require = window.__req__;
})();
</script>
</body>
</html>
